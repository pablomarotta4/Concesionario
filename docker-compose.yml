version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: concesionario-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-changeme123}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-concesionario}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - concesionario-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend FastAPI
  backend:
    build:
      context: ./Concesionario/backend/FastApi
      dockerfile: Dockerfile
    container_name: concesionario-backend
    restart: unless-stopped
    environment:
      # MongoDB
      - MONGODB_URL=mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD:-changeme123}@mongodb:27017/${MONGODB_DATABASE:-concesionario}?authSource=admin
      # JWT
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    volumes:
      # Código para desarrollo (hot reload)
      - ./Concesionario/backend/FastApi:/app
      # Persistir imágenes subidas
      - static_files:/app/static
      # Cache de modelos ML
      - huggingface_cache:/root/.cache/huggingface
      # Modelos entrenados
      - ./preference_model_best:/app/preference_model_best:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - concesionario-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: ./Concesionario/frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    container_name: concesionario-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - concesionario-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Backoffice Streamlit
  backoffice:
    build:
      context: ./Concesionario/backoffice
      dockerfile: Dockerfile
    container_name: concesionario-backoffice
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8501:8501"
    volumes:
      # Código para desarrollo
      - ./Concesionario/backoffice:/app
    depends_on:
      - backend
    networks:
      - concesionario-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Volúmenes
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  static_files:
    driver: local
  huggingface_cache:
    driver: local

# Redes
networks:
  concesionario-network:
    driver: bridge
    name: concesionario-network
